<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu — compagnon à l'arrêt</title>
<!-- Planche d'aperçu (31/08/2026) : le compagnon posé sur sa barre de vie, tel qu'il
     apparaît véhicule arrêté. Reprend la feuille de styles RÉELLE et le balisage réel
     de #nav-bottom-bar — rien n'est recopié à la main, sinon l'aperçu montrerait autre
     chose que l'app. Aucun script de l'app n'est chargé : la jauge et le portrait sont
     posés en dur dans l'état voulu. -->
<link rel="stylesheet" href="../css/styles.css">
<style>
    html, body { margin: 0; height: 100%; background: #0a0e17; }
    /* Tient lieu de carte : un aplat sombre suffit, ce qu'on regarde est le bas. */
    #faux-fond { position: absolute; inset: 0; background: #262b33; }
    /* La barre d'onglets permanente, pour juger la place réellement libre au-dessus. */
    #fausse-nav {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 64px;
        background: linear-gradient(0deg,#161226,#1b1630); border-top: 1px solid rgba(255,255,255,0.06);
        display: flex; align-items: center; justify-content: space-around;
        color: #6b6580; font-size: 11px; font-weight: 700; letter-spacing: .5px;
    }
    #fausse-nav .actif { color: #f0a35e; }
</style>
</head>
<body>
<div id="faux-fond"></div>

<div id="nav-bottom-bar" class="visible">
    <div id="nav-compagnon-portrait" class="visible" role="img" aria-label="État du compagnon">
        <svg class="pulse-marker-animal" width="79" height="96" viewBox="76 43 340 421" aria-hidden="true">
            <image href="../Images/Animals/Normal/Chien.png" x="0" y="0" width="512" height="512"/>
        </svg>
    </div>
    <div id="vie-compagnon" class="vie-compagnon" data-niveau="bon">
        <div class="vie-coeur">
            <svg viewBox="0 0 11 10" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
                <path d="M1 1h3v1h3V1h3v1h1v3h-1v1h-1v1h-1v1H8v1H7v1H4V9H3V8H2V7H1V6H0V2h1z"/>
            </svg>
        </div>
        <div class="vie-piste"><span class="vie-remplissage" style="width:100%"></span></div>
        <div class="vie-valeur">100%</div>
    </div>
    <div class="nav-stats-row">
        <div class="nav-stat-box">
            <div class="nav-stat-label">ARRIVÉE</div>
            <div class="nav-stat-value" id="nav-arrivee">19:31</div>
        </div>
        <button id="nav-google-close">✕</button>
        <div class="nav-stat-box" id="nav-eta-box" style="display:flex;">
            <div class="nav-stat-label">TEMPS RESTANT</div>
            <div class="nav-stat-value" id="nav-eta">9m 38s</div>
        </div>
    </div>
</div>

<div id="fausse-nav"><span class="actif">Itinéraire</span><span>Objectifs</span><span>Profil</span></div>
</body>
</html>
