<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Nunito', 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #FFB35C; } a:hover { color: #FFCB8E; }
    .disp { font-family: 'Baloo 2', 'Nunito', sans-serif; }
    .glass { background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.10); border-radius: 20px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.11); }
    .num { font-variant-numeric: tabular-nums; }
    @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.035) } }
    @keyframes sway { 0%,100% { transform: rotate(-5deg) } 50% { transform: rotate(5deg) } }
    @keyframes blink { 0%,90%,100% { transform: scaleY(1) } 95% { transform: scaleY(0.08) } }
    @keyframes halo { 0%,100% { opacity: 0.35; transform: scale(1) } 50% { opacity: 0.6; transform: scale(1.07) } }
    @keyframes drift { 0% { transform: translate(0,0); opacity: 0 } 25% { opacity: 1 } 100% { transform: translate(-30px,-30px); opacity: 0 } }
    .rk-body { animation: breathe 3.4s ease-in-out infinite; transform-origin: 60px 100px }
    .rk-tail { animation: sway 4.2s ease-in-out infinite; transform-origin: 30px 104px }
    .rk-eyes { animation: blink 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
    .halo { animation: halo 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
    .ff { animation: drift 5.5s linear infinite }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #1B1633; color: #F4EFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <!-- ============ CIEL ============ -->
  <div style="height: 100px; position: relative; flex-shrink: 0; overflow: hidden">
    <svg width="390" height="130" viewBox="0 0 390 130" style="position: absolute; top: 0; left: 0; display: block">
      <defs>
        <linearGradient id="sky3" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#20193F"/><stop offset="1" stop-color="#553565"/></linearGradient>
        <radialGradient id="glow3" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="#FFB35C" stop-opacity="0.35"/><stop offset="1" stop-color="#FFB35C" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="390" height="130" fill="url(#sky3)"/><rect width="390" height="130" fill="url(#glow3)"/>
      <g fill="#FFF0DC" opacity="0.65"><circle cx="52" cy="30" r="1.4"/><circle cx="132" cy="54" r="1.1"/><circle cx="196" cy="24" r="1.3"/><circle cx="284" cy="58" r="1.1"/></g>
    </svg>
    <div style="position: absolute; left: 18px; top: 26px; right: 18px; display: flex; align-items: center; justify-content: space-between">
      <div class="disp" style="font-size: 28px; font-weight: 700; letter-spacing: -0.01em">Moi</div>
      <div class="glass" style="width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD9A8" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>
  </div>

  <!-- ============ FEUILLE ============ -->
  <div style="flex-grow: 1; background: linear-gradient(180deg, rgba(43,32,72,0.94), rgba(27,22,51,0.98)); border-top: 1px solid rgba(255,255,255,0.12); border-radius: 32px 32px 0 0; margin-top: -32px; z-index: 2; padding: 16px 18px 0; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -24px 60px rgba(10,6,24,0.6)">

    <!-- ROUKI + catégorie -->
    <div style="border-radius: 26px; background: linear-gradient(150deg, rgba(255,179,92,0.16), rgba(255,143,163,0.07) 55%, rgba(255,255,255,0.03)); border: 1px solid rgba(255,179,92,0.25); padding: 14px 16px 15px; display: flex; flex-direction: column; gap: 13px">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="104" height="104" viewBox="0 0 120 130" style="flex-shrink: 0; overflow: visible">
          <ellipse class="halo" cx="60" cy="58" rx="46" ry="46" fill="#FFB35C" opacity="0.4"/>
          <ellipse cx="60" cy="120" rx="30" ry="5" fill="#0F0A20" opacity="0.4"/>
          <g class="rk-tail">
            <path d="M32 108 C6 104 4 74 20 60 C28 53 38 56 38 66 C38 76 24 78 24 90 C24 100 32 102 36 102 Z" fill="#E8763C"/>
            <path d="M20 62 C26 55 34 57 36 64 L26 72 Z" fill="#FFF0DC" opacity="0.85"/>
          </g>
          <g class="rk-body">
            <ellipse cx="60" cy="98" rx="27" ry="22" fill="#E8763C"/>
            <ellipse cx="60" cy="103" rx="16" ry="14" fill="#FFF0DC"/>
            <!-- ruban + médaille -->
            <path d="M46 84 L58 100 M74 84 L62 100" stroke="#FF8FA3" stroke-width="5" stroke-linecap="round"/>
            <circle cx="60" cy="106" r="12" fill="#E09456" stroke="#FFE0B8" stroke-width="2.5"/>
            <circle cx="60" cy="106" r="7.5" fill="none" stroke="#8A5220" stroke-width="1.6" opacity="0.6"/>
            <text x="60" y="110.5" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-size="11" font-weight="800" fill="#5A2F0E">3</text>
            <circle cx="36" cy="36" r="13" fill="#E8763C"/><circle cx="36" cy="37" r="7" fill="#FFF0DC"/>
            <circle cx="84" cy="36" r="13" fill="#E8763C"/><circle cx="84" cy="37" r="7" fill="#FFF0DC"/>
            <circle cx="60" cy="56" r="30" fill="#E8763C"/>
            <path d="M60 40 C44 40 33 50 33 62 C33 74 45 82 60 82 C75 82 87 74 87 62 C87 50 76 40 60 40 Z" fill="#FFF0DC"/>
            <ellipse cx="46" cy="43" rx="9" ry="6" fill="#FFF0DC"/><ellipse cx="74" cy="43" rx="9" ry="6" fill="#FFF0DC"/>
            <path d="M46 62 C44 70 45 76 48 79" stroke="#D9602C" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
            <path d="M74 62 C76 70 75 76 72 79" stroke="#D9602C" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
            <g class="rk-eyes">
              <ellipse cx="48" cy="55" rx="5" ry="6" fill="#33203A"/><ellipse cx="72" cy="55" rx="5" ry="6" fill="#33203A"/>
              <circle cx="50" cy="52.5" r="1.8" fill="#FFF"/><circle cx="74" cy="52.5" r="1.8" fill="#FFF"/>
            </g>
            <ellipse cx="39" cy="65" rx="6.5" ry="4.2" fill="#FF8FA3" opacity="0.5"/>
            <ellipse cx="81" cy="65" rx="6.5" ry="4.2" fill="#FF8FA3" opacity="0.5"/>
            <path d="M56.5 66 L63.5 66 L60 70 Z" fill="#33203A"/>
            <path d="M60 70 C60 73.5 56.5 74.5 55 72.5 M60 70 C60 73.5 63.5 74.5 65 72.5" stroke="#33203A" stroke-width="2" fill="none" stroke-linecap="round"/>
          </g>
          <g fill="#FFE9B8">
            <circle class="ff" cx="104" cy="52" r="2" style="animation-delay:0s"/>
            <circle class="ff" cx="112" cy="76" r="1.5" style="animation-delay:2.5s"/>
          </g>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
          <div style="font-size: 12px; font-weight: 700; color: #C6B6E4">Rang de Rouki</div>
          <div class="disp" style="font-size: 32px; font-weight: 800; color: #FFB35C; letter-spacing: -0.015em; line-height: 1">Bronze</div>
          <div style="font-size: 12px; font-weight: 600; color: #A897C9; line-height: 1.4">Encore 3 badges et il passe Argent.</div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="height: 8px; border-radius: 8px; background: rgba(0,0,0,0.3); overflow: hidden">
          <div style="width: 5%; height: 100%; border-radius: 8px; background: linear-gradient(90deg, #FFB35C, #FF8FA3)"></div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between">
          <div style="display: flex; gap: 6px">
            <div style="width: 9px; height: 9px; border-radius: 50%; border: 1.8px solid #FFB35C"></div>
            <div style="width: 9px; height: 9px; border-radius: 50%; border: 1.8px solid rgba(255,255,255,0.18)"></div>
            <div style="width: 9px; height: 9px; border-radius: 50%; border: 1.8px solid rgba(255,255,255,0.18)"></div>
          </div>
          <div class="num" style="font-size: 11.5px; font-weight: 800; color: #D8CCEE">0 / 3 badges</div>
        </div>
      </div>
    </div>

    <!-- stats -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px">
      <div class="glass" style="padding: 11px 14px">
        <div class="num disp" style="font-size: 24px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15">12 480</div>
        <div style="font-size: 11px; font-weight: 700; color: #8B7BAE">points au total</div>
      </div>
      <div class="glass" style="padding: 11px 14px; border-color: rgba(111,227,160,0.25)">
        <div class="num disp" style="font-size: 24px; font-weight: 700; color: #6FE3A0; letter-spacing: -0.01em; line-height: 1.15">92</div>
        <div style="font-size: 11px; font-weight: 700; color: #8B7BAE">score éco</div>
      </div>
    </div>

    <!-- rubriques -->
    <div style="display: flex; flex-direction: column; gap: 9px">

      <div class="glass" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 56px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7FD8E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M4 20V4M4 20h16"/><path d="M8 20v-6M13 20V9M18 20v-9"/></svg>
        <div style="flex-grow: 1; font-size: 14.5px; font-weight: 700">Mes trajets</div>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6E5F91" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>

      <div class="glass" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 56px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFB35C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M7 5.5H4.5V8a3 3 0 0 0 3 3M17 5.5h2.5V8a3 3 0 0 1-3 3"/><path d="M12 14v3M9 20h6"/></svg>
        <div style="flex-grow: 1; font-size: 14.5px; font-weight: 700">Le coffre à trophées</div>
        <span class="num" style="font-size: 11px; font-weight: 800; color: #FFD9A8; background: rgba(255,179,92,0.16); border-radius: 8px; padding: 3px 8px">0 / 8</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6E5F91" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>

      <div class="glass" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 56px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A88BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M3 14.5 4.7 9a2 2 0 0 1 1.9-1.4h10.8A2 2 0 0 1 19.3 9L21 14.5v4a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M6.5 14h.01M17.5 14h.01"/></svg>
        <div style="flex-grow: 1; font-size: 14.5px; font-weight: 700">Ma voiture</div>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6E5F91" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>

      <div class="glass" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 56px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B9A9D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 8.8V3.5M9.3 14.3 5.2 18M14.7 14.3 18.8 18"/></svg>
        <div style="flex-grow: 1; font-size: 14.5px; font-weight: 700">Aide à la conduite</div>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6E5F91" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>
    </div>

    <!-- style -->
    <div class="glass" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 56px">
      <div style="flex-grow: 1; font-size: 14.5px; font-weight: 700">Comment je conduis</div>
      <div style="display: flex; align-items: center; gap: 7px; background: rgba(111,227,160,0.14); border: 1px solid rgba(111,227,160,0.3); border-radius: 12px; padding: 6px 11px">
        <span style="font-size: 12.5px; font-weight: 800; color: #6FE3A0">Tout en douceur</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6FE3A0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>

  </div>

  <!-- ============ NAV FLOTTANTE ============ -->
  <div style="position: absolute; left: 18px; right: 18px; bottom: 20px; z-index: 6; height: 66px; border-radius: 24px; background: rgba(38,28,64,0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.11); box-shadow: 0 14px 38px rgba(10,6,24,0.55); display: flex; align-items: center; justify-content: space-around; padding: 0 8px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0 16px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C6C9E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>
      <span style="font-size: 10px; font-weight: 700; color: #7C6C9E">Route</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0 16px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C6C9E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v14"/><path d="M6 17h12v3H6a2 2 0 0 1 0-3Z"/></svg>
      <span style="font-size: 10px; font-weight: 700; color: #7C6C9E">Carnet</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; background: linear-gradient(135deg, rgba(255,197,120,0.22), rgba(255,143,92,0.16)); border: 1px solid rgba(255,179,92,0.35); border-radius: 17px; padding: 9px 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFB35C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
      <span style="font-size: 13.5px; font-weight: 800; color: #FFD9A8">Moi</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
