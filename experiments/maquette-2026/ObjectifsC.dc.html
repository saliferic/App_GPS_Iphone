<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Nunito', 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #FFB35C; } a:hover { color: #FFCB8E; }
    .disp { font-family: 'Baloo 2', 'Nunito', sans-serif; }
    .glass { background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.10); border-radius: 22px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.11); }
    .num { font-variant-numeric: tabular-nums; }
    @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.04) } }
    @keyframes blink { 0%,90%,100% { transform: scaleY(1) } 95% { transform: scaleY(0.08) } }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
    @keyframes drift { 0% { transform: translate(0,0); opacity: 0 } 25% { opacity: 1 } 100% { transform: translate(-40px,-34px); opacity: 0 } }
    @keyframes shimmer { 0% { transform: translateX(-110%) } 100% { transform: translateX(320%) } }
    @keyframes sprout { 0%,100% { transform: scale(1) rotate(0deg) } 50% { transform: scale(1.05) rotate(-2deg) } }
    .rk-body { animation: breathe 3.4s ease-in-out infinite; transform-origin: 60px 100px }
    .rk-eyes { animation: blink 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
    .done { animation: bob 3.6s ease-in-out infinite }
    .ff { animation: drift 6s linear infinite }
    .sh { animation: shimmer 2.6s ease-in-out infinite }
    .pl { animation: sprout 4.4s ease-in-out infinite }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #1B1633; color: #F4EFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <!-- ============ CIEL ============ -->
  <div style="height: 116px; position: relative; flex-shrink: 0; overflow: hidden">
    <svg width="390" height="146" viewBox="0 0 390 146" style="position: absolute; top: 0; left: 0; display: block">
      <defs>
        <linearGradient id="sky2" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#20193F"/><stop offset="1" stop-color="#4A3168"/></linearGradient>
        <radialGradient id="glow2" cx="0.2" cy="0.1" r="0.6"><stop offset="0" stop-color="#FF8FA3" stop-opacity="0.35"/><stop offset="1" stop-color="#FF8FA3" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="390" height="146" fill="url(#sky2)"/><rect width="390" height="146" fill="url(#glow2)"/>
      <g fill="#FFF0DC" opacity="0.7"><circle cx="316" cy="30" r="1.5"/><circle cx="348" cy="60" r="1.1"/><circle cx="262" cy="18" r="1.2"/><circle cx="368" cy="20" r="1.3"/></g>
    </svg>
    <div style="position: absolute; left: 18px; top: 22px; right: 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <div>
        <div style="font-size: 12.5px; font-weight: 700; color: #C6B6E4">Le carnet de Rouki</div>
        <div class="disp" style="font-size: 28px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em">Cette semaine</div>
      </div>
      <div class="glass" style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 15px; flex-shrink: 0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7FD8E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <span class="num" style="font-size: 13.5px; font-weight: 800; color: #7FD8E8">3j 14h</span>
      </div>
    </div>
  </div>

  <!-- ============ FEUILLE ============ -->
  <div style="flex-grow: 1; background: linear-gradient(180deg, rgba(43,32,72,0.94), rgba(27,22,51,0.98)); border-top: 1px solid rgba(255,255,255,0.12); border-radius: 32px 32px 0 0; margin-top: -32px; z-index: 2; padding: 18px 18px 0; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -24px 60px rgba(10,6,24,0.6)">

    <!-- mot de Rouki -->
    <div style="display: flex; align-items: center; gap: 11px; background: rgba(255,240,220,0.07); border-radius: 18px; padding: 11px 13px">
      <svg width="34" height="34" viewBox="0 0 120 120" style="flex-shrink: 0">
        <circle cx="36" cy="36" r="13" fill="#E8763C"/><circle cx="36" cy="37" r="7" fill="#FFF0DC"/>
        <circle cx="84" cy="36" r="13" fill="#E8763C"/><circle cx="84" cy="37" r="7" fill="#FFF0DC"/>
        <circle cx="60" cy="56" r="30" fill="#E8763C"/>
        <path d="M60 40 C44 40 33 50 33 62 C33 74 45 82 60 82 C75 82 87 74 87 62 C87 50 76 40 60 40 Z" fill="#FFF0DC"/>
        <ellipse cx="46" cy="43" rx="9" ry="6" fill="#FFF0DC"/><ellipse cx="74" cy="43" rx="9" ry="6" fill="#FFF0DC"/>
        <ellipse cx="48" cy="55" rx="5" ry="6" fill="#33203A"/><ellipse cx="72" cy="55" rx="5" ry="6" fill="#33203A"/>
        <circle cx="50" cy="52.5" r="1.8" fill="#FFF"/><circle cx="74" cy="52.5" r="1.8" fill="#FFF"/>
        <ellipse cx="39" cy="65" rx="6.5" ry="4.2" fill="#FF8FA3" opacity="0.5"/><ellipse cx="81" cy="65" rx="6.5" ry="4.2" fill="#FF8FA3" opacity="0.5"/>
        <path d="M56.5 66 L63.5 66 L60 70 Z" fill="#33203A"/>
      </svg>
      <div style="font-size: 13px; font-weight: 600; color: #D8CCEE; line-height: 1.45">Tu roules <strong style="color: #F4EFFF">210 km</strong> par semaine en moyenne — j'ai calé tes défis là-dessus.</div>
    </div>

    <!-- défis -->
    <div style="display: flex; flex-direction: column; gap: 11px">

      <!-- réussi -->
      <div class="done glass" style="display: flex; align-items: center; gap: 13px; padding: 14px 13px; border-radius: 22px; border-color: rgba(111,227,160,0.32); background: rgba(111,227,160,0.08)">
        <div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 15px; background: rgba(111,227,160,0.18); display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6FE3A0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
            <div style="font-size: 14px; font-weight: 800">180 km tout en douceur</div>
            <div class="num" style="flex-shrink: 0; font-size: 12.5px; font-weight: 800; color: #6FE3A0">terminé</div>
          </div>
          <div style="height: 7px; border-radius: 7px; background: rgba(0,0,0,0.3); overflow: hidden; position: relative">
            <div style="width: 100%; height: 100%; border-radius: 7px; background: linear-gradient(90deg, #6FE3A0, #7FD8E8)"></div>
            <div class="sh" style="position: absolute; top: 0; left: 0; width: 30%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent)"></div>
          </div>
        </div>
      </div>

      <!-- en cours -->
      <div class="glass" style="display: flex; align-items: center; gap: 13px; padding: 14px 13px; border-radius: 22px">
        <div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 15px; background: rgba(255,179,92,0.14); display: flex; align-items: center; justify-content: center">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFB35C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14.5 4.7 9a2 2 0 0 1 1.9-1.4h10.8A2 2 0 0 1 19.3 9L21 14.5v4a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M6.5 14h.01M17.5 14h.01"/></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
            <div style="display: flex; align-items: center; gap: 7px; min-width: 0">
              <span style="font-size: 14px; font-weight: 800">252 km au total</span>
              <span style="flex-shrink: 0; font-size: 9px; font-weight: 800; color: #C6B6E4; background: rgba(255,255,255,0.09); border-radius: 6px; padding: 2.5px 6px">SUR MESURE</span>
            </div>
            <div style="flex-shrink: 0"><span class="num" style="font-size: 15px; font-weight: 800">144</span><span class="num" style="font-size: 11px; color: #8B7BAE"> / 252</span></div>
          </div>
          <div style="height: 7px; border-radius: 7px; background: rgba(0,0,0,0.3); overflow: hidden">
            <div style="width: 57%; height: 100%; border-radius: 7px; background: linear-gradient(90deg, #FFB35C, #FF8FA3)"></div>
          </div>
        </div>
      </div>

      <!-- en cours -->
      <div class="glass" style="display: flex; align-items: center; gap: 13px; padding: 14px 13px; border-radius: 22px">
        <div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 15px; background: rgba(168,139,255,0.16); display: flex; align-items: center; justify-content: center">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#A88BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12Z"/></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
            <div style="font-size: 14px; font-weight: 800">1 500 points</div>
            <div style="flex-shrink: 0"><span class="num" style="font-size: 15px; font-weight: 800">920</span><span class="num" style="font-size: 11px; color: #8B7BAE"> / 1500</span></div>
          </div>
          <div style="height: 7px; border-radius: 7px; background: rgba(0,0,0,0.3); overflow: hidden">
            <div style="width: 61%; height: 100%; border-radius: 7px; background: linear-gradient(90deg, #A88BFF, #7FD8E8)"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- LA CLAIRIÈRE -->
    <div style="border-radius: 26px; overflow: hidden; border: 1px solid rgba(255,255,255,0.10); position: relative">
      <svg width="354" height="168" viewBox="0 0 354 168" style="display: block; width: 100%">
        <defs>
          <linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2050"/><stop offset="1" stop-color="#173A3A"/></linearGradient>
          <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
        </defs>
        <rect width="354" height="168" fill="url(#cl)"/>
        <circle cx="300" cy="34" r="16" fill="#FFE9B8" opacity="0.85"/>
        <circle cx="300" cy="34" r="30" fill="#FFE9B8" opacity="0.16" filter="url(#soft2)"/>
        <g fill="#FFF0DC" opacity="0.6"><circle cx="40" cy="26" r="1.4"/><circle cx="96" cy="46" r="1.1"/><circle cx="160" cy="22" r="1.3"/><circle cx="238" cy="52" r="1.1"/></g>
        <!-- sol -->
        <path d="M0 132 C60 118 120 126 178 122 C240 118 300 128 354 120 L354 168 L0 168 Z" fill="#1E4A40"/>
        <path d="M0 142 C70 134 130 142 200 138 C266 134 310 142 354 136 L354 168 L0 168 Z" fill="#183B34"/>
        <!-- pousses acquises -->
        <g class="pl" style="transform-origin: 62px 138px">
          <path d="M62 138 L62 112" stroke="#6FE3A0" stroke-width="3" stroke-linecap="round"/>
          <path d="M62 122 C52 120 48 112 50 104 C58 104 62 112 62 122 Z" fill="#6FE3A0"/>
          <path d="M62 128 C72 126 76 118 74 110 C66 110 62 118 62 128 Z" fill="#4FCB88"/>
          <circle cx="62" cy="108" r="8" fill="#6FE3A0" opacity="0.22" filter="url(#soft2)"/>
        </g>
        <g class="pl" style="transform-origin: 108px 142px; animation-delay: 1.2s">
          <path d="M108 142 L108 122" stroke="#7FD8E8" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="108" cy="118" r="7" fill="#7FD8E8"/>
          <circle cx="108" cy="118" r="14" fill="#7FD8E8" opacity="0.2" filter="url(#soft2)"/>
        </g>
        <!-- graines à venir -->
        <g opacity="0.4">
          <path d="M258 136 L258 128" stroke="#8B7BAE" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 3"/>
          <circle cx="258" cy="124" r="4" fill="none" stroke="#8B7BAE" stroke-width="2" stroke-dasharray="3 3"/>
          <path d="M300 140 L300 133" stroke="#8B7BAE" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 3"/>
          <circle cx="300" cy="129" r="4" fill="none" stroke="#8B7BAE" stroke-width="2" stroke-dasharray="3 3"/>
        </g>
        <!-- lucioles -->
        <g fill="#FFE9B8">
          <circle class="ff" cx="150" cy="120" r="2" style="animation-delay:0s"/>
          <circle class="ff" cx="200" cy="132" r="1.6" style="animation-delay:2s"/>
          <circle class="ff" cx="176" cy="110" r="1.8" style="animation-delay:4s"/>
        </g>
        <!-- Rouki assis -->
        <g transform="translate(160,74) scale(0.62)">
          <ellipse cx="60" cy="116" rx="28" ry="5" fill="#0F0A20" opacity="0.4"/>
          <path d="M32 104 C6 100 4 70 20 56 C28 49 38 52 38 62 C38 72 24 74 24 86 C24 96 32 98 36 98 Z" fill="#E8763C"/>
          <path d="M20 58 C26 51 34 53 36 60 L26 68 Z" fill="#FFF0DC" opacity="0.85"/>
          <g class="rk-body">
            <ellipse cx="60" cy="96" rx="27" ry="21" fill="#E8763C"/>
            <ellipse cx="60" cy="100" rx="16" ry="14" fill="#FFF0DC"/>
            <circle cx="36" cy="36" r="13" fill="#E8763C"/><circle cx="36" cy="37" r="7" fill="#FFF0DC"/>
            <circle cx="84" cy="36" r="13" fill="#E8763C"/><circle cx="84" cy="37" r="7" fill="#FFF0DC"/>
            <circle cx="60" cy="56" r="30" fill="#E8763C"/>
            <path d="M60 40 C44 40 33 50 33 62 C33 74 45 82 60 82 C75 82 87 74 87 62 C87 50 76 40 60 40 Z" fill="#FFF0DC"/>
            <ellipse cx="46" cy="43" rx="9" ry="6" fill="#FFF0DC"/><ellipse cx="74" cy="43" rx="9" ry="6" fill="#FFF0DC"/>
            <path d="M46 62 C44 70 45 76 48 79" stroke="#D9602C" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
            <path d="M74 62 C76 70 75 76 72 79" stroke="#D9602C" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
            <g class="rk-eyes">
              <path d="M43 55 C45.5 51 50.5 51 53 55" stroke="#33203A" stroke-width="3.4" fill="none" stroke-linecap="round"/>
              <path d="M67 55 C69.5 51 74.5 51 77 55" stroke="#33203A" stroke-width="3.4" fill="none" stroke-linecap="round"/>
            </g>
            <ellipse cx="39" cy="65" rx="6.5" ry="4.2" fill="#FF8FA3" opacity="0.5"/>
            <ellipse cx="81" cy="65" rx="6.5" ry="4.2" fill="#FF8FA3" opacity="0.5"/>
            <path d="M56.5 66 L63.5 66 L60 70 Z" fill="#33203A"/>
            <path d="M60 70 C60 73.5 56.5 74.5 55 72.5 M60 70 C60 73.5 63.5 74.5 65 72.5" stroke="#33203A" stroke-width="2" fill="none" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
      <div style="position: absolute; left: 14px; bottom: 12px; right: 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px">
        <div>
          <div class="disp" style="font-size: 17px; font-weight: 700; line-height: 1.1">Ta clairière</div>
          <div style="font-size: 11.5px; font-weight: 600; color: #A9F0C8">2 pousses sur 4 cette semaine</div>
        </div>
        <div style="font-size: 11px; font-weight: 700; color: #C6B6E4; background: rgba(0,0,0,0.35); border-radius: 10px; padding: 5px 9px">Score éco 92</div>
      </div>
    </div>

  </div>

  <!-- ============ NAV FLOTTANTE ============ -->
  <div style="position: absolute; left: 18px; right: 18px; bottom: 20px; z-index: 6; height: 66px; border-radius: 24px; background: rgba(38,28,64,0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.11); box-shadow: 0 14px 38px rgba(10,6,24,0.55); display: flex; align-items: center; justify-content: space-around; padding: 0 8px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0 16px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C6C9E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>
      <span style="font-size: 10px; font-weight: 700; color: #7C6C9E">Route</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; background: linear-gradient(135deg, rgba(127,216,232,0.2), rgba(168,139,255,0.16)); border: 1px solid rgba(127,216,232,0.35); border-radius: 17px; padding: 9px 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FD8E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v14"/><path d="M6 17h12v3H6a2 2 0 0 1 0-3Z"/></svg>
      <span style="font-size: 13.5px; font-weight: 800; color: #A9E8F4">Carnet</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0 16px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C6C9E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
      <span style="font-size: 10px; font-weight: 700; color: #7C6C9E">Moi</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
