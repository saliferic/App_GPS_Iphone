<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #C8FF3D; } a:hover { color: #DCFF7A; }
    .row { background: #1C1C20; border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B0B0D; color: #F2F2F3; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 56px; flex-shrink: 0; position: relative; overflow: hidden">
    <svg width="390" height="56" viewBox="0 0 390 56" style="display: block">
      <rect width="390" height="56" fill="#131316"/>
      <g stroke="#26262C" stroke-width="9" fill="none"><path d="M-10 22 L410 38"/><path d="M96 -10 L82 66"/><path d="M280 -10 L294 66"/></g>
      <g stroke="#1E1E23" stroke-width="4" fill="none"><path d="M0 48 L390 52"/><path d="M180 -10 L188 66"/><path d="M340 -10 L332 66"/></g>
    </svg>
  </div>

  <!-- ============ FEUILLE ============ -->
  <div style="flex-grow: 1; background: #141417; border-radius: 26px 26px 0 0; border-top: 1px solid rgba(255,255,255,0.08); margin-top: -26px; z-index: 2; padding: 10px 15px 0; display: flex; flex-direction: column; gap: 13px; box-shadow: 0 -18px 44px rgba(0,0,0,0.55)">

    <div style="width: 38px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.16); align-self: center"></div>

    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <div style="font-family: 'Bricolage Grotesque', 'Space Grotesk', sans-serif; font-size: 27px; font-weight: 700; letter-spacing: -0.02em; line-height: 1">Profil</div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>

    <!-- sélecteur de profil -->
    <div class="row" style="display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 52px">
      <div style="width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
      </div>
      <div style="flex-grow: 1; font-size: 14.5px; color: #55555D">Aucun profil créé</div>
      <div style="display: flex; align-items: center; gap: 9px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C8FF3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <div style="width: 1px; height: 18px; background: rgba(255,255,255,0.1)"></div>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
      </div>
    </div>

    <!-- ma catégorie -->
    <div style="background: linear-gradient(180deg, rgba(255,138,61,0.10), rgba(255,138,61,0.03)); border: 1px solid rgba(255,138,61,0.24); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 14px">
        <svg width="54" height="54" viewBox="0 0 54 54" style="flex-shrink: 0">
          <defs><linearGradient id="bz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA968"/><stop offset="1" stop-color="#B4652A"/></linearGradient></defs>
          <path d="M17 4 L21 22 M37 4 L33 22" stroke="#FF8A3D" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
          <circle cx="27" cy="34" r="16" fill="url(#bz)"/>
          <circle cx="27" cy="34" r="12" fill="none" stroke="rgba(0,0,0,0.22)" stroke-width="1.6"/>
          <text x="27" y="40" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="16" font-weight="800" fill="#4A2408">3</text>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
          <div style="font-size: 11.5px; color: #8A8A92">Ma catégorie</div>
          <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 25px; font-weight: 700; color: #FF8A3D; letter-spacing: -0.02em; line-height: 1">Bronze</div>
          <div style="font-size: 12px; color: #8A8A92">0 badge obtenu</div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 7px">
        <div style="height: 6px; border-radius: 6px; background: rgba(0,0,0,0.45); overflow: hidden">
          <div style="width: 4%; height: 100%; border-radius: 6px; background: #FF8A3D"></div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between">
          <div style="display: flex; gap: 6px">
            <div style="width: 9px; height: 9px; border-radius: 50%; border: 1.6px solid rgba(255,138,61,0.55)"></div>
            <div style="width: 9px; height: 9px; border-radius: 50%; border: 1.6px solid rgba(255,138,61,0.3)"></div>
            <div style="width: 9px; height: 9px; border-radius: 50%; border: 1.6px solid rgba(255,138,61,0.3)"></div>
          </div>
          <div style="font-size: 11.5px; color: #8A8A92"><span class="num" style="color: #F2F2F3; font-weight: 600">0 / 3</span> badges pour Argent</div>
        </div>
      </div>
    </div>

    <!-- statistiques rapides -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div class="row" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 3px">
        <div style="font-size: 11px; color: #6B6B73">Points totaux</div>
        <div class="num" style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">12 480</div>
      </div>
      <div class="row" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 3px">
        <div style="font-size: 11px; color: #6B6B73">Score éco</div>
        <div class="num" style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; color: #C8FF3D; letter-spacing: -0.02em">92</div>
      </div>
    </div>

    <!-- rubriques -->
    <div style="display: flex; flex-direction: column; gap: 8px">

      <div class="row" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 56px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M4 20V4M4 20h16"/><path d="M8 20v-6M13 20V9M18 20v-9"/></svg>
        <div style="flex-grow: 1; font-size: 14.5px; font-weight: 500">Mes statistiques</div>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#55555D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>

      <div class="row" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 56px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FF8A3D" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M7 5.5H4.5V8a3 3 0 0 0 3 3M17 5.5h2.5V8a3 3 0 0 1-3 3"/><path d="M12 14v3M9 20h6"/></svg>
        <div style="flex-grow: 1; font-size: 14.5px; font-weight: 500">Galerie des trophées</div>
        <span class="num" style="font-size: 11.5px; font-weight: 600; color: #FF8A3D; background: rgba(255,138,61,0.12); border-radius: 7px; padding: 3px 8px">0 / 8</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#55555D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>

      <div class="row" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 56px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M3 14.5 4.7 9a2 2 0 0 1 1.9-1.4h10.8A2 2 0 0 1 19.3 9L21 14.5v4a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M6.5 14h.01M17.5 14h.01"/></svg>
        <div style="flex-grow: 1; font-size: 14.5px; font-weight: 500">Mon véhicule</div>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#55555D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>

      <div class="row" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 56px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 8.8V3.5M9.3 14.3 5.2 18M14.7 14.3 18.8 18"/></svg>
        <div style="flex-grow: 1; font-size: 14.5px; font-weight: 500">Aide à la conduite</div>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#55555D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>
    </div>

    <!-- style de conduite -->
    <div class="row" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 56px">
      <div style="width: 8px; height: 8px; border-radius: 50%; background: #C8FF3D; flex-shrink: 0"></div>
      <div style="flex-grow: 1; font-size: 14.5px; font-weight: 500">Style de conduite</div>
      <div style="display: flex; align-items: center; gap: 7px; background: rgba(200,255,61,0.1); border-radius: 10px; padding: 6px 10px">
        <span style="font-size: 12.5px; font-weight: 600; color: #C8FF3D">Bon conducteur</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C8FF3D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>

  </div>

  <!-- ============ NAV ============ -->
  <div style="height: 64px; flex-shrink: 0; background: #0E0E11; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: stretch; z-index: 3">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #6B6B73">Itinéraire</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/></svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #6B6B73">Objectifs</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; position: relative">
      <div style="position: absolute; top: 0; left: 26%; right: 26%; height: 2.5px; border-radius: 0 0 3px 3px; background: #FF8A3D"></div>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FF8A3D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
      <span style="font-size: 10.5px; font-weight: 600; color: #FF8A3D">Profil</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
