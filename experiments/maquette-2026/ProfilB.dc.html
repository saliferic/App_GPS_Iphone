<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Gabarito', 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #2F5BFF; } a:hover { color: #1B41D6; }
    .blk { border: 2.5px solid #16130F; border-radius: 16px; box-shadow: 4px 4px 0 #16130F; background: #FFFFFF; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #1A1815; color: #16130F; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 44px; flex-shrink: 0; overflow: hidden">
    <svg width="390" height="44" viewBox="0 0 390 44" style="display: block">
      <rect width="390" height="44" fill="#1A1815"/>
      <g stroke="#2E2B26" stroke-width="10" fill="none"><path d="M-10 16 L410 32"/><path d="M96 -10 L82 54"/><path d="M280 -10 L294 54"/></g>
      <g stroke="#26241F" stroke-width="4" fill="none"><path d="M0 40 L390 44"/><path d="M180 -10 L188 54"/></g>
    </svg>
  </div>

  <!-- ============ FEUILLE ============ -->
  <div style="flex-grow: 1; background: #F5F1E6; border-top: 3px solid #16130F; border-radius: 26px 26px 0 0; margin-top: -26px; z-index: 2; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 13px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">Mon profil</div>
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; border: 2.5px solid #16130F; display: flex; align-items: center; justify-content: center">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>

    <!-- catégorie -->
    <div style="background: #16130F; border-radius: 22px; padding: 18px 16px; display: flex; flex-direction: column; gap: 15px">
      <div style="display: flex; align-items: center; gap: 15px">
        <svg width="66" height="66" viewBox="0 0 66 66" style="flex-shrink: 0">
          <path d="M20 5 L26 26 M46 5 L40 26" stroke="#FF3E88" stroke-width="7" stroke-linecap="round"/>
          <circle cx="33" cy="42" r="21" fill="#FF7A1A" stroke="#F5F1E6" stroke-width="3"/>
          <circle cx="33" cy="42" r="15" fill="none" stroke="#16130F" stroke-width="2.5" opacity="0.4"/>
          <text x="33" y="50" text-anchor="middle" font-family="Gabarito, sans-serif" font-size="22" font-weight="900" fill="#16130F">3</text>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1">
          <div style="font-size: 12px; font-weight: 700; color: #8C857A">Catégorie actuelle</div>
          <div style="font-size: 34px; font-weight: 900; color: #FF7A1A; letter-spacing: -0.03em; line-height: 1">Bronze</div>
          <div style="font-size: 12.5px; font-weight: 600; color: #B8B0A2">0 badge · prochain palier Argent</div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="height: 12px; border-radius: 12px; background: #2A2621; border: 2px solid #F5F1E6; overflow: hidden">
          <div style="width: 6%; height: 100%; background: #FF7A1A"></div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between">
          <div style="display: flex; gap: 7px">
            <div style="width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid #FF7A1A"></div>
            <div style="width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid #4A443C"></div>
            <div style="width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid #4A443C"></div>
          </div>
          <div class="num" style="font-size: 12px; font-weight: 800; color: #F5F1E6">0 / 3 badges</div>
        </div>
      </div>
    </div>

    <!-- stats -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px">
      <div class="blk" style="background: #FFD23D; padding: 12px 14px">
        <div class="num" style="font-size: 26px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.1">12 480</div>
        <div style="font-size: 11.5px; font-weight: 700">points au total</div>
      </div>
      <div class="blk" style="background: #12BE6E; padding: 12px 14px">
        <div class="num" style="font-size: 26px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.1">92</div>
        <div style="font-size: 11.5px; font-weight: 700">score éco</div>
      </div>
    </div>

    <!-- rubriques -->
    <div style="display: flex; flex-direction: column; gap: 10px">

      <div class="blk" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 60px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M4 20V4M4 20h16"/><path d="M8 20v-6M13 20V9M18 20v-9"/></svg>
        <div style="flex-grow: 1; font-size: 16px; font-weight: 700">Mes stats</div>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>

      <div class="blk" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 60px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M7 5.5H4.5V8a3 3 0 0 0 3 3M17 5.5h2.5V8a3 3 0 0 1-3 3"/><path d="M12 14v3M9 20h6"/></svg>
        <div style="flex-grow: 1; font-size: 16px; font-weight: 700">Mes trophées</div>
        <span class="num" style="font-size: 12px; font-weight: 800; background: #FF3E88; border: 2px solid #16130F; border-radius: 8px; padding: 3px 8px; color: #FFFFFF">0 / 8</span>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>

      <div class="blk" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 60px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M3 14.5 4.7 9a2 2 0 0 1 1.9-1.4h10.8A2 2 0 0 1 19.3 9L21 14.5v4a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M6.5 14h.01M17.5 14h.01"/></svg>
        <div style="flex-grow: 1; font-size: 16px; font-weight: 700">Ma voiture</div>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>

      <div class="blk" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 60px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 8.8V3.5M9.3 14.3 5.2 18M14.7 14.3 18.8 18"/></svg>
        <div style="flex-grow: 1; font-size: 16px; font-weight: 700">Aide à la conduite</div>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>
    </div>

    <!-- style de conduite -->
    <div class="blk" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 60px">
      <div style="flex-grow: 1; font-size: 16px; font-weight: 700">Mon style</div>
      <div style="display: flex; align-items: center; gap: 7px; background: #12BE6E; border: 2.5px solid #16130F; border-radius: 11px; padding: 6px 11px">
        <span style="font-size: 13.5px; font-weight: 800">Sage</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>

  </div>

  <!-- ============ NAV ============ -->
  <div style="height: 68px; flex-shrink: 0; background: #F5F1E6; border-top: 3px solid #16130F; display: flex; align-items: center; justify-content: space-around; padding: 0 8px; z-index: 3">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0 14px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8C857A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>
      <span style="font-size: 11px; font-weight: 700; color: #8C857A">Trajet</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0 14px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8C857A" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/></svg>
      <span style="font-size: 11px; font-weight: 700; color: #8C857A">Défis</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; background: #FF7A1A; border: 2.5px solid #16130F; border-radius: 13px; box-shadow: 3px 3px 0 #16130F; padding: 9px 14px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
      <span style="font-size: 14px; font-weight: 800">Profil</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
