<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Gabarito', 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #2F5BFF; } a:hover { color: #1B41D6; }
    .blk { border: 2.5px solid #16130F; border-radius: 18px; box-shadow: 4px 4px 0 #16130F; background: #FFFFFF; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #1A1815; color: #16130F; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 44px; flex-shrink: 0; overflow: hidden">
    <svg width="390" height="44" viewBox="0 0 390 44" style="display: block">
      <rect width="390" height="44" fill="#1A1815"/>
      <g stroke="#2E2B26" stroke-width="10" fill="none"><path d="M-10 24 L410 10"/><path d="M120 -10 L138 54"/><path d="M300 -10 L288 54"/></g>
      <g stroke="#26241F" stroke-width="4" fill="none"><path d="M0 40 L390 34"/><path d="M56 -10 L48 54"/></g>
    </svg>
  </div>

  <!-- ============ FEUILLE ============ -->
  <div style="flex-grow: 1; background: #F5F1E6; border-top: 3px solid #16130F; border-radius: 26px 26px 0 0; margin-top: -26px; z-index: 2; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 13px">

    <div style="font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">Défis de la semaine</div>

    <!-- série + temps restant -->
    <div style="display: flex; gap: 11px">
      <div class="blk" style="flex-grow: 1; background: #FF3E88; display: flex; align-items: center; gap: 11px; padding: 12px 14px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#16130F" stroke="none" style="flex-shrink: 0"><path d="M12 2c3 4 1.5 6 0 7.5C10 11.5 6 12 6 16a6 6 0 0 0 12 0c0-3-1-4.5-2.5-6 0 2-1 3-2 3 1.5-3 1-7.5-1.5-11Z"/></svg>
        <div>
          <div class="num" style="font-size: 24px; font-weight: 900; line-height: 1">7</div>
          <div style="font-size: 11.5px; font-weight: 700">semaines d'affilée</div>
        </div>
      </div>
      <div class="blk" style="flex-grow: 1; display: flex; align-items: center; gap: 11px; padding: 12px 14px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <div>
          <div class="num" style="font-size: 24px; font-weight: 900; line-height: 1">3j 14h</div>
          <div style="font-size: 11.5px; font-weight: 700; color: #8C857A">avant reset</div>
        </div>
      </div>
    </div>

    <!-- note baseline -->
    <div style="display: flex; align-items: center; gap: 11px; background: #E8E2D2; border: 2.5px dashed #B8B0A2; border-radius: 15px; padding: 11px 13px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8C857A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M4 20V4M4 20h16"/><path d="M8 20v-6M13 20V9M18 20v-9"/></svg>
      <div style="font-size: 12px; font-weight: 600; color: #6E675C; line-height: 1.45">Calés sur ta moyenne de <span class="num" style="color: #16130F; font-weight: 800">210 km</span>/semaine.</div>
    </div>

    <!-- défis -->
    <div style="display: flex; flex-direction: column; gap: 11px">

      <!-- fait -->
      <div class="blk" style="background: #12BE6E; display: flex; align-items: center; gap: 13px; padding: 14px">
        <div style="flex-shrink: 0; width: 46px; height: 46px; border-radius: 14px; background: #F5F1E6; border: 2.5px solid #16130F; display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
            <div style="font-size: 15px; font-weight: 800; line-height: 1.25">180 km sans excès</div>
            <div class="num" style="flex-shrink: 0; font-size: 13px; font-weight: 800">180/180</div>
          </div>
          <div style="height: 10px; border-radius: 10px; background: #F5F1E6; border: 2px solid #16130F; overflow: hidden">
            <div style="width: 100%; height: 100%; background: #FFD23D"></div>
          </div>
        </div>
      </div>

      <!-- en cours -->
      <div class="blk" style="display: flex; align-items: center; gap: 13px; padding: 14px">
        <div style="flex-shrink: 0; width: 46px; height: 46px; border-radius: 14px; background: #2F5BFF; border: 2.5px solid #16130F; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14.5 4.7 9a2 2 0 0 1 1.9-1.4h10.8A2 2 0 0 1 19.3 9L21 14.5v4a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M6.5 14h.01M17.5 14h.01"/></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
            <div style="display: flex; align-items: center; gap: 7px; min-width: 0">
              <span style="font-size: 15px; font-weight: 800">252 km au total</span>
              <span style="flex-shrink: 0; font-size: 9.5px; font-weight: 800; background: #FFD23D; border: 2px solid #16130F; border-radius: 6px; padding: 1px 5px">AUTO</span>
            </div>
            <div class="num" style="flex-shrink: 0; font-size: 13px; font-weight: 800">144/252</div>
          </div>
          <div style="height: 10px; border-radius: 10px; background: #E8E2D2; border: 2px solid #16130F; overflow: hidden">
            <div style="width: 57%; height: 100%; background: #2F5BFF"></div>
          </div>
        </div>
      </div>

      <!-- en cours -->
      <div class="blk" style="display: flex; align-items: center; gap: 13px; padding: 14px">
        <div style="flex-shrink: 0; width: 46px; height: 46px; border-radius: 14px; background: #FFD23D; border: 2.5px solid #16130F; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#16130F" stroke="#16130F" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12Z"/></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
            <div style="font-size: 15px; font-weight: 800">1 500 points</div>
            <div class="num" style="flex-shrink: 0; font-size: 13px; font-weight: 800">920/1500</div>
          </div>
          <div style="height: 10px; border-radius: 10px; background: #E8E2D2; border: 2px solid #16130F; overflow: hidden">
            <div style="width: 61%; height: 100%; background: #FF7A1A"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- badge -->
    <div style="display: flex; align-items: center; gap: 14px; background: #16130F; border-radius: 20px; padding: 15px 16px">
      <div style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 50%; background: #F5F1E6; border: 2.5px dashed #8C857A; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.8 7 21.5l5-2.6 5 2.6-1.5-7.7"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 17px; font-weight: 800; color: #FFD23D; line-height: 1.1">Plus que 2 défis</div>
        <div style="font-size: 12.5px; font-weight: 600; color: #B8B0A2; line-height: 1.4">et le badge de la semaine est à toi.</div>
      </div>
    </div>

  </div>

  <!-- ============ NAV ============ -->
  <div style="height: 68px; flex-shrink: 0; background: #F5F1E6; border-top: 3px solid #16130F; display: flex; align-items: center; justify-content: space-around; padding: 0 8px; z-index: 3">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0 14px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8C857A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>
      <span style="font-size: 11px; font-weight: 700; color: #8C857A">Trajet</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; background: #2F5BFF; border: 2.5px solid #16130F; border-radius: 13px; box-shadow: 3px 3px 0 #16130F; padding: 9px 14px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/></svg>
      <span style="font-size: 14px; font-weight: 800; color: #FFFFFF">Défis</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0 14px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8C857A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
      <span style="font-size: 11px; font-weight: 700; color: #8C857A">Profil</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
